<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Password — ICO</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/tokens.css" /><link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/nav.css" /><link rel="stylesheet" href="styles/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo"><span class="nav__logo-icon">⚡</span><span>ICO</span></a>
      <ul class="nav__links"></ul>
      <div class="nav__actions">
        <button class="btn-theme" id="themeToggle" aria-label="Toggle theme"><span class="btn-theme__icon">☀</span></button>
      </div>
    </div>
  </nav>

  <main class="login-page" style="grid-template-columns:1fr">
    <div class="login-right" style="border:none">
      <div class="login-form-wrap">
        <div class="login-header">
          <div style="font-size:var(--text-xl);font-weight:900;background:var(--grad-hero);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1.5rem">⚡ ICO</div>
          <h1 class="login-title">Set New Password</h1>
          <p class="login-sub">Choose a strong password for your account</p>
        </div>

        <form id="resetForm" novalidate>
          <div class="login-field">
            <label for="newPw">New Password</label>
            <div class="login-field__input-wrap">
              <svg class="login-field__icon" viewBox="0 0 20 20" fill="none"><rect x="3.5" y="9" width="13" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 9V6.5a3.5 3.5 0 017 0V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="13.25" r="1.25" fill="currentColor"/></svg>
              <input type="password" id="newPw" placeholder="Min. 8 characters" required minlength="8" />
            </div>
          </div>
          <div class="login-field" style="margin-top:1rem">
            <label for="confirmPw">Confirm Password</label>
            <div class="login-field__input-wrap">
              <svg class="login-field__icon" viewBox="0 0 20 20" fill="none"><rect x="3.5" y="9" width="13" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 9V6.5a3.5 3.5 0 017 0V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="13.25" r="1.25" fill="currentColor"/></svg>
              <input type="password" id="confirmPw" placeholder="Repeat password" required />
            </div>
          </div>
          <div class="form-error" id="resetError"></div>
          <button type="submit" class="login-btn" style="margin-top:1.5rem"><span>Update Password</span></button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
