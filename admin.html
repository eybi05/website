?<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — ICO</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/tokens.css" /><link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/nav.css" /><link rel="stylesheet" href="styles/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <meta name="description" content="Compete Globally. Support Meaningfully. The International Charity Olympiad � Season 1, Summer 2026." />
  <meta property="og:title" content="Admin � ICO" />
  <meta property="og:description" content="Compete Globally. Support Meaningfully. The International Charity Olympiad � Season 1, Summer 2026." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://internation-steel.vercel.app/admin.html" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Admin � ICO" />
  <meta name="twitter:description" content="Compete Globally. Support Meaningfully. The International Charity Olympiad � Season 1, Summer 2026." /></head>
<body>
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo"><span class="nav__logo-icon">⚡</span><span>ICO</span></a>
      <ul class="nav__links"></ul>
      <div class="nav__actions">
        <button class="btn-theme" id="themeToggle" aria-label="Toggle theme"><span class="btn-theme__icon">☀</span></button>
        <button class="btn btn--ghost btn--sm" id="navLogoutBtn" style="display:none">Logout</button>
      </div>
    </div>
  </nav>

  <main class="admin-page">
    <div class="container">
      <div class="admin-header">
        <h1 class="admin-title">Admin Panel</h1>
        <span class="admin-badge">🔒 Restricted</span>
      </div>

      <div class="admin-stats">
        <div class="admin-stat"><div class="admin-stat__label">Registrations</div><div class="admin-stat__val" id="statReg">—</div></div>
        <div class="admin-stat"><div class="admin-stat__label">Donations</div><div class="admin-stat__val" id="statDon">—</div></div>
        <div class="admin-stat"><div class="admin-stat__label">Total Raised</div><div class="admin-stat__val" id="statRaised">—</div></div>
        <div class="admin-stat"><div class="admin-stat__label">Referrals</div><div class="admin-stat__val" id="statRef">—</div></div>
      </div>

      <div class="admin-section">
        <div class="admin-section__title">Registrations</div>
        <table class="admin-table">
          <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Country</th><th>School</th><th>Subject</th><th>Points</th><th>Referral Code</th><th>Registered</th></tr></thead>
          <tbody id="regTable"><tr><td colspan="9" class="admin-empty">Loading…</td></tr></tbody>
        </table>
      </div>

      <div class="admin-section">
        <div class="admin-section__title">Donations</div>
        <table class="admin-table">
          <thead><tr><th>#</th><th>Name</th><th>Amount</th><th>Anonymous</th><th>Date</th></tr></thead>
          <tbody id="donTable"><tr><td colspan="5" class="admin-empty">Loading…</td></tr></tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
